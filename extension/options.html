<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiring Badge Finder - Settings</title>
<style>
  body { font: 15px/1.5 system-ui, Segoe UI, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #1b1f23; }
  h1 { font-size: 20px; }
  label { display: block; margin: 16px 0 6px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 15px; border: 1px solid #8b949e; border-radius: 6px; }
  button { margin-top: 14px; padding: 8px 16px; font-size: 15px; border: 0; border-radius: 6px; background: #6b3fa0; color: #fff; cursor: pointer; }
  #msg { margin-top: 12px; min-height: 1.4em; }
  .ok { color: #1a7f37; } .bad { color: #cf222e; }
  small { color: #57606a; }
  @media (prefers-color-scheme: dark) { body { background: #0d1117; color: #e6edf3; } input { background: #161b22; color: #e6edf3; border-color: #484f58; } small { color: #8b949e; } }
</style>
</head>
<body>
  <h1>Hiring Badge Finder</h1>
  <label for="server">Dashboard address</label>
  <input id="server" type="url" placeholder="http://localhost:8000" autocomplete="off">
  <small>Use <b>http://localhost:8000</b> on this computer, or the address of your deployed dashboard (download the extension from that dashboard).</small><br>
  <button id="save">Save</button>
  <div id="msg" role="status"></div>
  <script src="options.js"></script>
</body>
</html>
