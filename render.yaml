# Render Blueprint for Hiring Badge Finder (see DEPLOY.md). FREE: no card needed.
# The leads live in a free Neon Postgres database (DATABASE_URL), because a free Render
# service has no disk: its files are wiped on every restart.
services:
  - type: web
    name: hiring-badge-finder
    runtime: python
    plan: free
    region: singapore        # next to the Neon database (AWS ap-southeast-1): each query ~1 ms instead of ~200 ms
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/extension/info
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false            # Render asks for it: paste the Neon connection string (postgresql://...)
      - key: HBF_WEBSITE_LOOKUP
        value: "1"
      # RENDER_EXTERNAL_URL is set by Render automatically; the server trusts only that address.
